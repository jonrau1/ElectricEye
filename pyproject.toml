[tool.poetry]
name = "electriceye"
version = "0.1.0"
description = "ElectricEye is a multi-cloud security auditing tool"
authors = ["ElectricEye Contributors"]
readme = "README.md"
packages = [{include = "eeauditor"}]

[tool.poetry.dependencies]
python = "^3.9"
awscli = ">=1.32.108"
boto3 = ">=1.34.108"
click = "8.1.8"
detect-secrets = "1.5.0"
google-api-python-client = ">=2.88.0"
matplotlib = ">=3.9.0"
oci = ">=2.104.0"
pandas = ">=2.2.0"
pluginbase = "1.0.1"
psycopg2-binary = ">=2.9.9"
pymongo = ">=4.6.1"
pysnow = "<=0.7.17"
python3-nmap = ">=1.6.0"
tomli = ">=2.0.1"
vt-py = ">=0.18.0"
snowflake-connector-python = ">=3.12.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
black = "^24.0.0"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=eeauditor",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (may require external resources)",
    "slow: marks tests as slow-running tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["eeauditor"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/distutils/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"